# fly.toml — Brecha Arbitrage Engine on Fly.io.
# Docs: https://fly.io/docs/reference/configuration/

app = 'coding-challenge-mexico'
primary_region = 'lax'

[build]

[env]
  PORT = '8080'
  DATA_DIR = '/data'
  DEMO_MODE = 'false'
  ALLOWED_ORIGIN = '*'

# Persistent volume so the SQLite store (trades + recorder WAL) survives
# redeploys. Create once with:
#   fly volumes create brecha_data --size 1 --region lax
[mounts]
  source = 'brecha_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  # Bot needs to stay alive 24/7 to keep the 10 exchange WS streams open and
  # the spread models warm. Auto-stop would kill the data layer between visits.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 200
    soft_limit = 150

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
